name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build

  notify:
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Power Automate of build status
        env:
          WEBHOOK_URL: ${{ secrets.POWER_AUTOMATE_BUILD_WEBHOOK_URL }}
        run: |
          status="success"
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            status="failure"
          fi
          if [ -n "$WEBHOOK_URL" ]; then
            curl -sf -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"status\":\"$status\",\"repo\":\"${{ github.repository }}\",\"branch\":\"${{ github.ref_name }}\",\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"workflow\":\"${{ github.workflow }}\"}" \
              || echo "Notification failed (non-blocking)"
          else
            echo "POWER_AUTOMATE_BUILD_WEBHOOK_URL not set, skipping notification"
          fi